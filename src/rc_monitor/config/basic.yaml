/**/jetson_monitor_node:
  ros__parameters:
    diagnostic_updater:
      period: 1.0               # [s] one /diagnostics message per period

    # WARN from `warn`, ERROR from `error`.
    cpu: {warn: 85.0, error: 95.0}          # [%] mean over all cores
    gpu: {warn: 85.0, error: 95.0}          # [%]
    memory: {warn: 85.0, error: 95.0}       # [%] RAM, shared with the GPU
    temperature: {warn: 85.0, error: 95.0}  # [C] hottest zone; this board throttles at 99, shuts down at 104.5
    disk: {warn: 90.0, error: 97.0}         # [%] of /, which bags fill
    wifi: {warn: -70.0, error: -80.0}       # [dBm] lower is worse

    # Below the minimum is WARN, nothing at all is ERROR.
    scan_topic: scan
    scan_min_hz: 36.0           # UST-10LX: 40
    odom_topic: odom
    odom_min_hz: 18.0           # rf2o: 20
