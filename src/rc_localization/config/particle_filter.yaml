/**/particle_filter_node:
  ros__parameters:
    scan_topic: scan
    odom_topic: odom

    # Rays are cast on the Jetson's GPU: RangeLibc must be built with WITH_CUDA=ON.
    max_range: 10.0          # [m] the UST-10LX's
    angle_step: 18           # cast every n-th beam of the scan

    max_particles: 4000
    max_viz_particles: 60
    squash_factor: 2.2

    # Sensor model: how likely a short, max-range, random and correct reading
    # is. The defaults of Corey Walsh's particle_filter, which this one adapts.
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0

    # Motion model noise. Its defaults too, tuned on a car of this scale.
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25

    publish_odom: true
    publish_tf: false        # map_odom_broadcaster_node publishes map -> odom instead
    viz: true

/**/map_server:
  ros__parameters:
    topic_name: map
    frame_id: map
