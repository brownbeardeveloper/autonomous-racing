bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.0

    # laserscan parameters: a Hokuyo UST-10LX. 4.7 rad rather than its 4.712,
    # because this only labels the scan header and the gym always ray-casts
    # over 4.7 rad. The range limits and both rates need patches/f1tenth_simulator-*.
    scan_fov: 4.7
    scan_beams: 1080
    scan_range_min: 0.06
    scan_range_max: 10.0
    scan_rate_hz: 40.0

    # odom/tf publish rate: the sim's own 100 Hz physics step
    odom_tf_rate_hz: 100.0

    # map parameters: map_path is set by launch/sim.launch.py
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # ego starting pose on map: the first row of spielberg's racingline.csv,
    # so the car starts on the line and facing along it
    sx: -69.437209
    sy: 54.472512
    stheta: -3.092382

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True
